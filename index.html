<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#150d24" />
    <title>Mouse on the Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0614;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #150d24;
        color: #ffd34d;
        font: 14px/2 "Press Start 2P", monospace;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 16px;
        box-sizing: border-box;
      }
      #rotate .phone {
        width: 40px;
        height: 64px;
        border: 4px solid #fff6d8;
        border-radius: 8px;
        margin-bottom: 24px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 600px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate">
      <div class="phone"></div>
      <div>Turn your phone<br />sideways to play!</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
